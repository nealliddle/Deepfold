<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deepfold</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  --ui-bg:rgba(240,245,250,.9);--ui-solid:#fbfdff;--ui-fg:#0d1a2b;--ui-muted:#4a5c71;--ui-line:rgba(13,26,43,.11);
  --ui-accent:#1f63d1;--ui-on-accent:#fff;--ui-disc:rgba(244,248,252,.86);--ui-sh1:rgba(4,14,30,.2);--ui-sh2:rgba(4,14,30,.1);
  color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  font-family:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ui-bg:rgba(7,15,29,.86);--ui-solid:#13223a;--ui-fg:#e4edf8;--ui-muted:#91a4bb;--ui-line:rgba(228,237,248,.12);
  --ui-accent:#78aaff;--ui-on-accent:#06142a;--ui-disc:rgba(9,19,35,.76);--ui-sh1:rgba(0,0,0,.5);--ui-sh2:rgba(0,0,0,.28);color-scheme:dark}}
:root[data-theme="dark"]{--ui-bg:rgba(7,15,29,.86);--ui-solid:#13223a;--ui-fg:#e4edf8;--ui-muted:#91a4bb;--ui-line:rgba(228,237,248,.12);
  --ui-accent:#78aaff;--ui-on-accent:#06142a;--ui-disc:rgba(9,19,35,.76);--ui-sh1:rgba(0,0,0,.5);--ui-sh2:rgba(0,0,0,.28);color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;background:#02060f;color:var(--ui-fg);-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;opacity:0;transition:opacity 1.8s ease}
body.ready #scene{opacity:1}
body.food #scene{cursor:crosshair}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ui-accent);outline-offset:2px}
#intro{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;color:#eaf3ff;text-align:center;transition:opacity 1.4s ease;text-shadow:0 2px 24px rgba(0,0,0,.35)}
#intro h1{margin:0;font-weight:300;font-size:clamp(46px,10vw,104px);letter-spacing:-.035em;line-height:1}
#intro p{margin:.9em 0 0;font-size:16px;opacity:.78}
body.started #intro{opacity:0}
.paper{background:var(--ui-bg);-webkit-backdrop-filter:blur(16px) saturate(1.25);backdrop-filter:blur(16px) saturate(1.25);box-shadow:inset 0 0 0 1px var(--ui-line),0 2px 4px var(--ui-sh2),0 16px 36px var(--ui-sh1)}
#dock{position:fixed;right:0;bottom:0;display:flex;flex-direction:column;gap:10px;padding:16px calc(16px + env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) 16px;transition:opacity .35s,transform .35s}
.disc{width:50px;height:50px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;background:var(--ui-disc);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:inset 0 0 0 1px var(--ui-line),0 1px 2px var(--ui-sh2),0 6px 14px var(--ui-sh1);transition:background .2s,transform .15s}
.disc:active{transform:scale(.94)}
.disc svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.disc[aria-pressed="true"]{background:var(--ui-accent);color:var(--ui-on-accent)}
#bShow{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:0;margin-bottom:calc(14px + env(safe-area-inset-bottom,0px));opacity:0;pointer-events:none;width:40px;height:40px;transition:opacity .4s}
body.ui-hidden #bShow{opacity:.28;pointer-events:auto}
body.ui-hidden #bShow:hover,body.ui-hidden #bShow:focus-visible{opacity:.9}
body.ui-hidden #dock,body.editing #dock{opacity:0;pointer-events:none;transform:translateX(20px)}
#toast{position:fixed;left:50%;top:0;margin-top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-8px);padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .35s,transform .35s;white-space:nowrap;z-index:9}
#toast.show{opacity:1;transform:translate(-50%,0)}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(380px,94vw);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transform:translateX(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);border-radius:22px 0 0 22px;z-index:5}
body.panel-open #panel{transform:none}
#panel header{display:flex;align-items:center;justify-content:space-between;padding:16px 14px 10px 20px}
#panel h2{margin:0;font-size:20px;font-weight:500;letter-spacing:-.01em}
#panelBody{overflow-y:auto;overscroll-behavior:contain;padding:0 0 24px}
.close{width:38px;height:38px;border-radius:50%;border:0;background:var(--ui-line);cursor:pointer;display:grid;place-items:center}
.close svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round}
details.sec-d{border-top:1px solid var(--ui-line)}
summary{list-style:none;cursor:pointer;padding:15px 20px;font-weight:600;font-size:15px;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:8px;height:8px;border-right:1.6px solid var(--ui-muted);border-bottom:1.6px solid var(--ui-muted);transform:rotate(45deg) translateY(-3px);transition:transform .25s}
details[open]>summary::after{transform:rotate(-135deg) translateY(-2px)}
.sec{display:grid;gap:16px;padding:2px 20px 20px}
.sub{font-size:12.5px;font-weight:600;color:var(--ui-muted);margin:6px 0 -6px}
.ctl{display:grid;gap:8px;font-size:14px}
.ctl .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ctl output{color:var(--ui-muted);font-variant-numeric:tabular-nums;font-size:13px}
.ctl.toggle{grid-template-columns:1fr auto;align-items:center}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;margin:0;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--ui-line)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--ui-line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-8px;border-radius:50%;background:var(--ui-solid);box-shadow:inset 0 0 0 5px var(--ui-accent),0 2px 6px var(--ui-sh1)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border:0;border-radius:50%;background:var(--ui-solid);box-shadow:inset 0 0 0 5px var(--ui-accent),0 2px 6px var(--ui-sh1)}
.switch{-webkit-appearance:none;appearance:none;width:42px;height:26px;border-radius:13px;background:var(--ui-line);position:relative;cursor:pointer;margin:0;transition:background .2s}
.switch::before{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ui-solid);box-shadow:0 1px 3px var(--ui-sh1);transition:transform .2s}
.switch:checked{background:var(--ui-accent)}
.switch:checked::before{transform:translateX(16px)}
.seg{display:flex;background:var(--ui-line);border-radius:11px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 4px;font-size:13px;cursor:pointer;color:var(--ui-muted)}
.seg button[aria-pressed="true"]{background:var(--ui-solid);color:var(--ui-fg);box-shadow:0 1px 3px var(--ui-sh2)}
.palettes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pal{border:0;background:transparent;padding:3px;border-radius:12px;cursor:pointer;display:grid;gap:5px;font-size:11.5px;color:var(--ui-muted);text-align:center}
.pal .sw{display:block;height:34px;border-radius:9px;box-shadow:inset 0 0 0 1px var(--ui-line)}
.pal[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ui-accent);color:var(--ui-fg)}
.grad{display:grid;gap:8px}
.gbar{position:relative;height:40px;border-radius:10px;cursor:copy;touch-action:none;box-shadow:inset 0 0 0 1px var(--ui-line);margin:0 9px}
.gstop{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.3);cursor:grab;padding:0}
.gstop[aria-pressed="true"]{transform:scale(1.25);box-shadow:0 0 0 2px var(--ui-accent),0 2px 8px rgba(0,0,0,.35)}
.gends{display:flex;justify-content:space-between;font-size:12px;color:var(--ui-muted);margin:0 2px}
.grow{display:flex;align-items:center;gap:10px;font-size:13.5px}
.grow span{flex:1}
.cin{-webkit-appearance:none;appearance:none;width:36px;height:36px;border:0;padding:0;border-radius:50%;background:none;cursor:pointer;box-shadow:0 0 0 1px var(--ui-line),0 2px 6px var(--ui-sh2);flex:none}
.cin::-webkit-color-swatch-wrapper{padding:0}
.cin::-webkit-color-swatch{border:0;border-radius:50%}
.cin::-moz-color-swatch{border:0;border-radius:50%}
.colors{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.col{display:grid;justify-items:center;gap:5px;font-size:12px;color:var(--ui-muted);text-align:center;cursor:pointer}
.ctl.colrow{grid-template-columns:1fr auto;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:0;padding:8px 13px;border-radius:999px;background:var(--ui-line);font-size:13.5px;font-weight:500;cursor:pointer}
.chip:disabled{opacity:.4;cursor:default}
.chip[aria-pressed="true"],.chip.primary{background:var(--ui-accent);color:var(--ui-on-accent)}
.footer{padding:16px 20px;border-top:1px solid var(--ui-line);display:flex;gap:8px;flex-wrap:wrap}
.note{font-size:12.5px;color:var(--ui-muted);line-height:1.45;margin:-6px 0 0}
#editBar{position:fixed;left:50%;bottom:0;width:min(560px,100%);transform:translate(-50%,115%);transition:transform .4s cubic-bezier(.2,.8,.2,1);border-radius:20px 20px 0 0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:4}
body.editing:not(.edit-min) #editBar{transform:translate(-50%,0)}
#editBar .r{display:flex;align-items:center;gap:8px}
.mini{width:36px;height:36px;flex:none;border-radius:50%;border:0;background:var(--ui-line);cursor:pointer;font-size:19px;line-height:1;display:grid;place-items:center}
.lname{flex:1;min-width:0;display:grid;line-height:1.15}
.lname strong{font-weight:600;font-size:14.5px}
.lname span{font-size:12px;color:var(--ui-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#eTool{flex:none;width:136px}
#eBrush{flex:1}
#eMore{display:none;gap:10px}
#editBar.more #eMore{display:grid}
#eTab{position:fixed;left:50%;top:0;margin-top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-160%);border:0;border-radius:999px;padding:9px 16px;font-size:13.5px;cursor:pointer;transition:transform .35s;z-index:4}
body.editing.edit-min #eTab{transform:translate(-50%,0)}
@media (min-width:900px){
  #editBar{left:0;top:0;bottom:auto;width:330px;margin:calc(16px + env(safe-area-inset-top,0px)) 0 0 calc(16px + env(safe-area-inset-left,0px));border-radius:20px;padding:14px;transform:translateX(-120%)}
  body.editing:not(.edit-min) #editBar{transform:none}
}
#brush{position:fixed;left:0;top:0;border-radius:50%;border:1.5px solid rgba(255,255,255,.85);box-shadow:0 0 0 1px rgba(0,0,0,.35);pointer-events:none;transform:translate(-50%,-50%);display:none}
body.editing #brush.on{display:block}
.ring{position:fixed;width:180px;height:180px;margin:-90px 0 0 -90px;border-radius:50%;border:1.5px solid rgba(255,255,255,.4);pointer-events:none;animation:ring 1.6s ease-out forwards}
@keyframes ring{from{transform:scale(.08);opacity:.8}to{transform:scale(1.2);opacity:0}}
#err{position:fixed;inset:0;display:none;place-items:center;color:#dfe9f6;text-align:center;padding:24px;font-size:16px}
@media (max-width:640px){#panel{top:auto;left:0;width:100%;max-height:76vh;transform:translateY(105%);border-radius:22px 22px 0 0}}
@media (prefers-reduced-motion:reduce){#panel,#editBar,#dock,#eTab{transition:none}.ring{animation-duration:.6s}}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 16px 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch;flex:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;border-radius:999px;padding:8px 14px;background:var(--ui-line);font-size:13.5px;font-weight:500;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ui-accent);color:var(--ui-on-accent)}
.pane{display:none;gap:16px;padding:6px 20px 22px}
.pane.on{display:grid}
.grp{font-size:12.5px;font-weight:600;color:var(--ui-muted);margin:10px 0 -6px;padding-top:12px;border-top:1px solid var(--ui-line)}
.grp:first-child{border-top:0;padding-top:0;margin-top:0}
.slider{position:relative;height:30px;touch-action:pan-y;cursor:ew-resize;outline:none}
.strack{position:absolute;left:10px;right:10px;top:13px;height:4px;border-radius:2px;background:var(--ui-line)}
.sfill{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--ui-accent);opacity:.5}
.sthumb{position:absolute;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:var(--ui-solid);box-shadow:inset 0 0 0 5px var(--ui-accent),0 2px 6px var(--ui-sh1);transition:transform .15s}
.slider.drag .sthumb{transform:scale(1.25)}
.slider:focus-visible .sthumb{outline:2px solid var(--ui-accent);outline-offset:3px}
.hide{display:none!important}
</style>
</head>
<body>
<canvas id="scene" aria-label="Underwater paper scene. Drag to look around, tap to knock on the glass."></canvas>
<div id="intro"><div><h1>Deepfold</h1><p>Drag to look around. Tap the glass.</p></div></div>
<div id="toast" class="paper" role="status" aria-live="polite"></div>
<div id="brush"></div>
<div id="err"><p>This scene needs WebGL, which isn’t available in this browser.</p></div>
<nav id="dock" aria-label="Controls">
  <button class="disc" id="bFood" aria-pressed="false" aria-label="Drop food" title="Drop food (F)"><svg viewBox="0 0 24 24"><path d="M5 4.5l2.2.6-.6 2.2-2.2-.6z"/><path d="M14 3l2.4 1-1 2.4-2.4-1z"/><path d="M9.5 10l2.2.4-.4 2.2-2.2-.4z"/><path d="M17.5 11.5l2 1-1 2-2-1z"/><path d="M4 20c2.5-1.6 5.5-1.6 8 0s5.5 1.6 8 0"/></svg></button>
  <button class="disc" id="bSound" aria-pressed="false" aria-label="Ambient sound" title="Sound (S)"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="w" d="M15.5 9a4 4 0 0 1 0 6"/><path class="w" d="M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="m" d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button>
  <button class="disc" id="bEdit" aria-pressed="false" aria-label="Edit sheets" title="Edit sheets (E)"><svg viewBox="0 0 24 24"><path d="M14.5 4.5l5 5L10 19H5v-5z"/><path d="M12.5 6.5l5 5"/></svg></button>
  <button class="disc" id="bSettings" aria-pressed="false" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
  <button class="disc" id="bHide" aria-label="Hide controls" title="Hide controls (H)"><svg viewBox="0 0 24 24"><path d="M3 12s3.5-6 9-6c2 0 3.7.8 5 1.8M21 12s-3.5 6-9 6c-2 0-3.7-.8-5-1.8"/><path d="M4 20L20 4"/></svg></button>
</nav>
<button class="disc" id="bShow" aria-label="Show controls" title="Show controls (H)"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="18" cy="12" r="1"/></svg></button>
<aside id="panel" class="paper" aria-label="Settings">
  <header><h2>Settings</h2><button class="close" id="bClose" aria-label="Close settings"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Settings sections"></nav>
  <div id="panelBody"></div>
</aside>
<section id="editBar" class="paper" aria-label="Edit sheets">
  <div class="r">
    <button class="mini" id="ePrev" aria-label="Nearer sheet">‹</button>
    <div class="lname"><strong id="eName">Sheet 1</strong><span id="eSub">Front</span></div>
    <button class="mini" id="eNext" aria-label="Deeper sheet">›</button>
    <button class="mini" id="eMin" aria-label="Hide edit tools" title="Hide tools to see the whole scene">–</button>
  </div>
  <div class="r">
    <div class="seg" id="eTool" role="group" aria-label="Brush"><button data-v="fill" aria-pressed="true">Paint</button><button data-v="erase" aria-pressed="false">Erase</button></div>
    <input type="range" id="eBrush" min="0.6" max="5" step="0.1" aria-label="Brush size">
  </div>
  <div id="eMore">
    <label class="ctl"><span class="row"><span>Push sheet back or forward</span><output id="eNudgeOut"></output></span><input type="range" id="eNudge" min="-1" max="1" step="0.01"></label>
    <div class="chips"><button class="chip" id="eIsolate" aria-pressed="false">Isolate</button><button class="chip" id="eGrid" aria-pressed="true">Grid</button><button class="chip" id="eFill">Fill sheet</button><button class="chip" id="eClear">Clear sheet</button><button class="chip" id="eReset">Reset sheet</button></div>
  </div>
  <div class="chips"><button class="chip" id="eUndo">Undo</button><button class="chip" id="eMoreBtn" aria-pressed="false">More</button><button class="chip primary" id="eDone">Done</button></div>
</section>
<button id="eTab" class="paper">Show edit tools</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
if (!window.THREE) { $('#err').style.display = 'grid'; $('#err p').textContent = 'The 3D library didn’t load. Check your connection and reload.'; return; }

/* ================= utilities ================= */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash2(x,y,s){let h=Math.imul(x|0,374761393)^Math.imul(y|0,668265263)^Math.imul(s|0,982451653);h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296;}
function vnoise2(x,y,s){const xi=Math.floor(x),yi=Math.floor(y);let xf=x-xi,yf=y-yi;xf=xf*xf*(3-2*xf);yf=yf*yf*(3-2*yf);const a=hash2(xi,yi,s),b=hash2(xi+1,yi,s),c=hash2(xi,yi+1,s),d=hash2(xi+1,yi+1,s);return a+(b-a)*xf+(c-a)*yf+(a-b-c+d)*xf*yf;}
function fbm(x,y,s,o){o=o||3;let v=0,a=.5,f=1,n=0;for(let i=0;i<o;i++){v+=a*vnoise2(x*f,y*f,s+i*101);n+=a;a*=.5;f*=2.03;}return v/n;}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
const pow2near = v => Math.pow(2, Math.round(Math.log2(Math.max(1, v))));
const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;
const rnd = (a, b) => a + Math.random() * (b - a);
function b64(u8){ let s = ''; for (let i = 0; i < u8.length; i += 8192) s += String.fromCharCode.apply(null, u8.subarray(i, i + 8192)); return btoa(s); }
function unb64(str){ const s = atob(str), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }

/* ================= palettes, scenes, settings ================= */
const PALETTES = {

    if (h) ui.sel = +h.dataset.i; else { const t = tAt(e), obj = {t:clamp(t, .01, .99), c:'#' + gradAt(t, new THREE.Color()).getHexString()}; S.stops.push(obj); S.stops.sort((a, b) => a.t - b.t); ui.sel = S.stops.indexOf(obj); markCustom(); }

}
function makeSlider(it){

  sl.tabIndex = 0; sl.setAttribute('role', 'slider'); sl.setAttribute('aria-label', it.label); sl.setAttribute('aria-valuemin', min); sl.setAttribute('aria-valuemax', max);
  tr.append(fill, th); sl.append(tr); row.append(mk('span', '', it.label), out); wrap.append(row, sl);
  const draw = () => { const f = clamp((S[k] - min) / (max - min), 0, 1); fill.style.width = f * 100 + '%'; th.style.left = f * 100 + '%'; out.textContent = fmt(S[k]); sl.setAttribute('aria-valuenow', S[k]); sl.setAttribute('aria-valuetext', fmt(S[k])); };
  const setVal = v => { v = clamp(Math.round((v - min) / step) * step + min, min, max); v = step >= 1 ? Math.round(v) : +v.toFixed(4); if (v === S[k]) return false; S[k] = v; if (k === 'focus') focusTarget = null; draw(); if (it.live !== false) FX[it.fx](false); return true; };
  const finish = () => { FX[it.fx](true); saveSettings(); };
  let st = null;
  sl.addEventListener('pointerdown', e => { st = {x:e.clientX, y:e.clientY, id:e.pointerId, active:false, v0:S[k]}; });
  sl.addEventListener('pointermove', e => {
    if (!st || e.pointerId !== st.id) return; const dx = e.clientX - st.x, dy = e.clientY - st.y;
    if (!st.active) { if (Math.abs(dy) > 8 && Math.abs(dy) > Math.abs(dx)) { st = null; return; } if (Math.abs(dx) < 6) return; st.active = true; try { sl.setPointerCapture(e.pointerId); } catch (er) {} sl.classList.add('drag'); }
    setVal(st.v0 + dx / Math.max(80, tr.getBoundingClientRect().width) * (max - min));
  });
  const end = () => { if (st && st.active) { sl.classList.remove('drag'); finish(); } st = null; };
  sl.addEventListener('pointerup', end); sl.addEventListener('pointercancel', end);
  sl.addEventListener('keydown', e => { const big = e.shiftKey ? 10 : 1; let d = 0;
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') d = step * big; else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') d = -step * big; else if (e.key === 'Home') { setVal(min); finish(); e.preventDefault(); return; } else if (e.key === 'End') { setVal(max); finish(); e.preventDefault(); return; } else return;
    e.preventDefault(); if (setVal(S[k] + d)) finish(); });

}
function makeControl(it){
  let el;
  if (it.type === 'gradient') el = makeGradient();
  else if (it.type === 'scenes') { el = mk('div', 'chips'); for (const [key, sc] of Object.entries(SCENES)) { const b = mk('button', 'chip scene', sc.name); b.dataset.key = key; b.setAttribute('aria-pressed', 'false'); b.onclick = () => applyScene(key); el.appendChild(b); } }
  else if (it.type === 'palettes') { el = mk('div', 'palettes');
    for (const [key, p] of Object.entries(PALETTES)) { const b = mk('button', 'pal'); b.dataset.key = key; b.setAttribute('aria-pressed', S.palette === key); const sw = mk('span', 'sw'); sw.style.background = `linear-gradient(90deg, ${p.stops.map(s => `${s[1]} ${s[0] * 100}%`).join(', ')})`; b.append(sw, mk('span', '', p.name)); b.onclick = () => applyPalette(key); el.appendChild(b); } }
  else if (it.type === 'colors') { el = mk('div', 'colors');
    for (const [k, label] of it.keys) { const l = mk('label', 'col'), inp = mk('input', 'cin'); inp.type = 'color'; inp.value = S[k]; inp.setAttribute('aria-label', label + ' colour');
      inp.oninput = () => { S[k] = inp.value; updateColors(); saveSettings(); }; l.append(inp, mk('span', '', label)); el.appendChild(l); controls[k] = {set:v => inp.value = v}; } }
  else if (it.type === 'color') { el = mk('label', 'ctl colrow'); const inp = mk('input', 'cin'); inp.type = 'color'; inp.value = S[it.k]; inp.oninput = () => { S[it.k] = inp.value; FX[it.fx](true); saveSettings(); }; el.append(mk('span', '', it.label), inp); controls[it.k] = {set:v => inp.value = v}; }
  else if (it.type === 'note') el = mk('p', 'note', it.text);
  else if (it.type === 'sub') el = mk('div', 'sub', it.text);

  else if (it.type === 'buttons') { el = mk('div', 'chips'); for (const [label, act] of it.items) { const b = mk('button', 'chip', label); b.onclick = () => ACTIONS[act](); el.appendChild(b); } }
  else if (it.type === 'chipset') { el = mk('div', 'chips'); for (const k of it.keys) { const b = mk('button', 'chip', it.map[k].name); b.setAttribute('aria-pressed', !!S[it.obj][k]);
      b.onclick = () => { S[it.obj][k] = !S[it.obj][k]; b.setAttribute('aria-pressed', S[it.obj][k]); FX[it.fx](true); saveSettings(); }; el.appendChild(b); } }

    for (const [v, lab] of it.options) { const b = mk('button', '', lab); b.setAttribute('aria-pressed', S[it.k] === v); b.onclick = () => { S[it.k] = v; btns.forEach(x => x.setAttribute('aria-pressed', x === b)); FX[it.fx](true); saveSettings(); }; btns.push(b); seg.appendChild(b); }
    controls[it.k] = {set:val => btns.forEach((b, i) => b.setAttribute('aria-pressed', it.options[i][0] === val))}; el.append(mk('span', '', it.label), seg); }

  if (it.show) conditional.push({el, show:it.show});
  return el;
}
function buildPanel(){
  const tabs = $('#tabs'), root = $('#panelBody'); const panes = [];
  TABS.forEach((t, i) => {
    const b = mk('button', 'tab', t.tab); b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', i === activeTab); b.id = 'tab' + i; tabs.appendChild(b);
    const pane = mk('div', 'pane' + (i === activeTab ? ' on' : '')); pane.setAttribute('role', 'tabpanel'); pane.setAttribute('aria-labelledby', 'tab' + i);
    for (const it of t.items) pane.appendChild(makeControl(it));
    root.appendChild(pane); panes.push(pane);
    b.onclick = () => { activeTab = i; tabs.querySelectorAll('.tab').forEach((x, j) => x.setAttribute('aria-selected', j === i)); panes.forEach((p, j) => p.classList.toggle('on', j === i)); root.scrollTop = 0; };
  });
  const f = mk('div', 'footer'); const rb = mk('button', 'chip', 'Reset settings'); rb.onclick = ACTIONS.resetSettings; f.appendChild(rb); root.appendChild(f);
  refreshVisibility();
}

/* ================= post-processing: water shimmer, tap ripple, depth of field ================= */
let rt = null, postMat = null;
const postScene = new THREE.Scene(), postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
function postActive(){ return !editMode && (S.dof || S.waterFx > .001); }
function ensureRT(){
  const sz = new THREE.Vector2(); renderer.getDrawingBufferSize(sz);
  if (!postMat) {
    postMat = new THREE.ShaderMaterial({ uniforms:{ tCol:{value:null}, uRes:{value:new THREE.Vector2()}, uFocus:shared.uFocus, uRange:shared.uRange, uNear:shared.uNear, uFar:shared.uFar, uMax:{value:12},
      uDof:{value:0}, uWater:{value:0}, uWScale:{value:.4}, uWSpeed:{value:.4}, uTime:shared.uTime, uRip:{value:new THREE.Vector4()} },
      vertexShader:'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }', fragmentShader:POST_FS, depthTest:false, depthWrite:false });
    const q = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMat); q.frustumCulled = false; postScene.add(q); syncUniforms();
  }

  rt = IS_GL2 && THREE.WebGLMultisampleRenderTarget ? new THREE.WebGLMultisampleRenderTarget(sz.x, sz.y, opts) : new THREE.WebGLRenderTarget(sz.x, sz.y, opts);

/* ================= resize & loop ================= */
let refitTimer = 0;
function resize(){
  aspect = innerWidth / Math.max(1, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, dprCap())); renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = aspect; camera.updateProjectionMatrix(); updatePix();
  if (rt) ensureRT();

    applyLayout(false); updateEditVisuals();
    if (layoutAspect && Math.abs(aspect - layoutAspect) / layoutAspect > .08) { clearTimeout(refitTimer); refitTimer = setTimeout(() => { layoutAspect = aspect; applyLayout(true); refitGrids(); }, 350); }
  }
}
addEventListener('resize', resize);
let last = performance.now(), fpsAcc = 0, fpsN = 0;

  updateCamera(dt);
  const N = layers.length; if (N >= 3) { for (const f of fishes) updateFish(f, dt, N); for (const c of crawlers) updateCrawler(c, dt); }
  updateFood(dt); updateRays(); updateTrails(dt); musicTick();
  if (AC && S.sound) { bubbleClock -= dt; if (bubbleClock < 0) { bubbleClock = 2 + Math.random() * 6; sfxBubble(.025 + Math.random() * .04); } }
  if (S.quality === 'auto' && time > 4 && initialDone) { fpsAcc += dt; fpsN++; if (fpsAcc > 2.5) { const fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; if (fps < 38 && autoScale > .76) { autoScale *= .88; resize(); } } }
  if (post) { ensureRT(); postMat.uniforms.uRip.value.set(ripple.x, ripple.y, age, rs); renderer.setRenderTarget(rt); renderer.render(scene, camera); renderer.setRenderTarget(null); renderer.render(postScene, postCam); }

/* ================= init ================= */
resize(); layoutAspect = aspect; resetLens();
S.layers = clamp(S.layers | 0, 6, 30);
for (let i = 0; i < S.layers; i++) layers.push(makeLayer());
